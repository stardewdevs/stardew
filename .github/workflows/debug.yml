name: debug - APK

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        env:
          BUILD_TYPE: debug
        run: ./gradlew assembleDebug --stacktrace --warning-mode all

      - name: List Generated APKs
        run: ls -la stardew-app/build/outputs/apk/debug/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: stardew-debug
          path: stardew-app/build/outputs/apk/debug/*.apk
