name: debug - APK

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64, universal]
        include:
          - abi: universal
            abiFilter: ''
          - abi: arm64-v8a
            abiFilter: arm64-v8a
          - abi: armeabi-v7a
            abiFilter: armeabi-v7a
          - abi: x86
            abiFilter: x86
          - abi: x86_64
            abiFilter: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK for ${{ matrix.abi }}
        env:
          BUILD_TYPE: debug
        run: |
          if [ "${{ matrix.abi }}" = "universal" ]; then
            ./gradlew assembleDebug
            # Rename universal APK to include -universal
            for f in stardew-app/build/outputs/apk/debug/*.apk; do
              mv "$f" "${f%.apk}-universal.apk"
            done
          else
            ./gradlew assembleDebug -Pandroid.abiFilters=${{ matrix.abiFilter }}
          fi

      - name: Upload APK Artifact for ${{ matrix.abi }}
        uses: actions/upload-artifact@v7
        with:
          name: stardew-debug-${{ matrix.abi }}
          path: stardew-app/build/outputs/apk/debug/*.apk
